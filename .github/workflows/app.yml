# 新版（app/，Slint 原生）：改动 app/** 时在 Windows + macOS 上 fmt → clippy → test → build，上传 zip。
# 旧版的发版流程在 release.yml，两者互不影响。
name: App

on:
  push:
    paths: ['app/**', '.github/workflows/app.yml']
  pull_request:
    paths: ['app/**', '.github/workflows/app.yml']

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # macos-latest 是 Apple 芯片，本机编出来就是 aarch64-apple-darwin（design §11 第 8 条）。
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      CARGO_TERM_COLOR: always
      MACOSX_DEPLOYMENT_TARGET: '13.0'
    defaults:
      run:
        working-directory: app
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app

      - run: cargo fmt --check
      - run: cargo clippy -p tilex --all-targets -- -D warnings
      # R-10：测试用 --release 跑；source_rules.rs / unicode_paths.rs 在这里面。
      - run: cargo test -p tilex --release
      - run: cargo build -p tilex --release
      - name: Build OCR sidecar (Windows)
        if: runner.os == 'Windows'
        run: cargo build --release -p tilex-ocr

      # macOS 的 OCR 是 Apple Vision，一个 Swift 小工具子进程（design §2.11）。
      # Xcode 预装在 runner 上，不用额外装工具链。
      - name: Build OCR sidecar (macOS)
        if: runner.os == 'macOS'
        run: swiftc -O -o target/release/tilex-ocr macos/ocr.swift

      # B3 起 zip 里再加 tilex-ocr.exe 和 wcocr.dll。
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path target/release/tilex.exe, target/release/tilex-ocr.exe, vendor/wcocr.dll -DestinationPath ../tilex-windows-x64.zip

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          app=target/TiLex.app
          rm -rf "$app"
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
          cp target/release/tilex "$app/Contents/MacOS/tilex"
          cp target/release/tilex-ocr "$app/Contents/MacOS/tilex-ocr"
          # 图标：源图只有 512×512，所以 iconset 最大做到 512（没有 512@2x）。
          # 缺了这一步 Finder 显示系统的通用应用图标（朋友 09-19 实测）。
          iconset=target/TiLex.iconset
          rm -rf "$iconset" && mkdir -p "$iconset"
          for spec in 16:icon_16x16 32:icon_16x16@2x 32:icon_32x32 64:icon_32x32@2x \
                      128:icon_128x128 256:icon_128x128@2x 256:icon_256x256 \
                      512:icon_256x256@2x 512:icon_512x512; do
            sips -z "${spec%%:*}" "${spec%%:*}" icon.png --out "$iconset/${spec##*:}.png" >/dev/null
          done
          iconutil -c icns "$iconset" -o "$app/Contents/Resources/TiLex.icns"
          # LSUIElement：只在菜单栏，不显示 Dock 图标。
          cat > "$app/Contents/Info.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleIdentifier</key><string>com.tilex.app</string>
            <key>CFBundleName</key><string>TiLex</string>
            <key>CFBundleExecutable</key><string>tilex</string>
            <key>CFBundleIconFile</key><string>TiLex</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>${version}</string>
            <key>CFBundleVersion</key><string>${version}</string>
            <key>LSMinimumSystemVersion</key><string>13.0</string>
            <key>LSUIElement</key><true/>
            <key>NSHighResolutionCapable</key><true/>
          </dict>
          </plist>
          EOF
          plutil -lint "$app/Contents/Info.plist"
          # 嵌套的可执行文件要先单独签：`codesign "$app"` 不会递归进 Contents/MacOS/，
          # 里面留一个没签名的二进制会让整个 bundle 的签名校验失败。
          codesign --force --sign - "$app/Contents/MacOS/tilex-ocr"
          codesign --force --sign - "$app"
          ditto -c -k --keepParent "$app" ../tilex-macos-arm64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: tilex-${{ runner.os }}
          path: tilex-*.zip
          if-no-files-found: error

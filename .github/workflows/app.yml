# Slint 原生版：改动源码时在 Windows 上 fmt → clippy → test → build，上传 zip。
name: App

on:
  push:
    paths: ['src/**', 'ui/**', 'tests/**', 'ocr-sidecar/**', 'vendor/**', 'Cargo.*', 'build.rs', 'app.rc', '.github/workflows/app.yml']
  pull_request:
    paths: ['src/**', 'ui/**', 'tests/**', 'ocr-sidecar/**', 'vendor/**', 'Cargo.*', 'build.rs', 'app.rc', '.github/workflows/app.yml']

jobs:
  build:
    runs-on: windows-latest
    env:
      CARGO_TERM_COLOR: always
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - run: cargo fmt --check
      - run: cargo clippy -p tilex --all-targets -- -D warnings
      # R-10：测试用 --release 跑；source_rules.rs / unicode_paths.rs 在这里面。
      - run: cargo test -p tilex --release
      - run: cargo build -p tilex --release
      - name: Build OCR sidecar
        run: cargo build --release -p tilex-ocr

      # B3 起 zip 里再加 tilex-ocr.exe 和 wcocr.dll。
      - name: Package
        shell: pwsh
        run: Compress-Archive -Path target/release/tilex.exe, target/release/tilex-ocr.exe, vendor/wcocr.dll -DestinationPath tilex-windows-x64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: tilex-${{ runner.os }}
          path: tilex-*.zip
          if-no-files-found: error

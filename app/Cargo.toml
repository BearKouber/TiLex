[package]
name = "tilex"
version = "0.2.1"
description = "TiLex"
authors = ["auroraascent"]
license = "GPL-3.0-only"
edition = "2024"
publish = false

[workspace]
members = ["ocr-sidecar"]

# D19：安装包走 cargo-packager 出 NSIS，不出 MSI（旧版顺带打的，没人用）。
# 打包前要先 cargo build --release -p tilex -p tilex-ocr，packager 不负责编译。
# 路径相对本文件所在目录。
[package.metadata.packager]
product-name = "TiLex"
# 沿用旧版的 identifier：NSIS 的卸载注册表键按 product-name 走，publisher 从这里取第二段（tilex），
# 两者都和 0.1.2 一致，装新版时才认得出旧版并先卸载它。
identifier = "com.tilex.desktop"
formats = ["nsis"]
icons = ["icon.ico"]
license-file = "../LICENSE"
category = "Utility"
copyright = "GPLv3"
long-description = "TiLex - a Windows translation and OCR tool: select text or screenshot to translate, multiple built-in engines plus custom AI services."
# tilex-ocr.exe 要和 tilex.exe 同目录（ocr.rs 的 sidecar() 只找同级和上一级）。
binaries = [
    { path = "tilex", main = true },
    { path = "tilex-ocr" },
]
# wcocr.dll 落到 $INSTDIR\vendor\（ocr.rs 的 wcocr_dll() 第一顺位）。
# 这两个漏了程序照样启动，但 OCR 全废。
resources = [{ src = "vendor/wcocr.dll", target = "vendor/wcocr.dll" }]

[package.metadata.packager.nsis]
# 注意：这个键只认 `installMode` / `installer-mode`，写 `install-mode` 会被
# deny_unknown_fields 打回（cargo-packager 0.11.8 的 alias 少写了一个）。
installMode = "perMachine"
installer-icon = "icon.ico"
display-language-selector = true
languages = ["SimpChinese", "TradChinese", "English"]
# 不设 appdata-paths：卸载器就不会出现"删除应用数据"的勾，%APPDATA%\TiLex 里的
# 生词本和配置永远留着（prd「卸载不许删生词本」）。

[dependencies]
# 只开软件渲染（D11），GPU 渲染器根本不编进来。
# compat-1-2 是 slint 强制要求的（缺了 lib.rs 里 compile_error!）。
# raw-window-handle-06：从 Slint 窗口拿 HWND 设 DWM 圆角。
# system-tray：Slint 自带托盘（design §2.12），菜单写在 .slint 里走 @tr。
# unstable-winit-030：只为建浮标时给 winit 传 with_active(false)。默认属性下 Slint 第一次 show()
# 会 SW_SHOW 激活窗口、抢走用户的焦点（winit 0.30 源码，见 platform-windows.md）。
# 不引新 crate（winit 本来就编进来了）；"unstable" 指 Slint 小版本间可能改签名，Cargo.lock 锁着 1.17.1。
slint = { version = "1.17.1", default-features = false, features = [
    "std",
    "backend-winit",
    "renderer-software",
    "compat-1-2",
    "raw-window-handle-06",
    "system-tray",
    "unstable-winit-030",
] }
raw-window-handle = "0.6"
thiserror = "2"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
lingua = { version = "1.8.0", optional = true, default-features = false }
# D14：同步 HTTP，只在 src/service/http.rs 用。rustls + platform-verifier：证书仍走系统证书库。
# 不用 native-tls：走 SChannel 时 Google 网页接口按 TLS 指纹回 429（B1 实测，curl/rustls 同 IP 都是 200）。
ureq = { version = "3.4.2", default-features = false, features = ["rustls", "platform-verifier"] }
# 生词本（design §2.3）。Windows 没有可靠的系统 SQLite，所以 bundled。
rusqlite = { version = "0.40.2", features = ["bundled"] }
global-hotkey = "0.8.0"
png = "0.18"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
pinyin = { version = "0.10", default-features = false, features = ["plain"] }
rfd = { version = "0.15", default-features = false }
hmac = "0.12"
sha2 = "0.10"
md-5 = "0.10"

[dev-dependencies]
pulldown-cmark = { version = "0.13", default-features = false }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58.0", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Media_Speech",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Accessibility",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
embed-resource = "3"
slint-build = "1.17.1"

[features]
# 本地语种识别。哪些语言被编进来只由这里决定（lingua 的 Language 变体随 feature 门控）。
# detect-lite 是 detect-full 的子集，同时开时 Cargo 取并集，结果就是 full。
default = ["detect-lite"]
local-detect = ["lingua"]
detect-lite = ["local-detect", "lingua/chinese", "lingua/japanese", "lingua/english", "lingua/korean"]
detect-full = ["local-detect", "lingua/chinese", "lingua/japanese", "lingua/english", "lingua/korean", "lingua/french", "lingua/spanish", "lingua/german", "lingua/russian", "lingua/italian", "lingua/portuguese", "lingua/turkish", "lingua/arabic", "lingua/vietnamese", "lingua/thai", "lingua/indonesian", "lingua/malay", "lingua/hindi", "lingua/mongolian", "lingua/persian", "lingua/nynorsk", "lingua/bokmal", "lingua/ukrainian"]

# D13 内存实测用，不进产物：cargo run --release --example lingua_mem --features detect-full -- high
[[example]]
name = "lingua_mem"
required-features = ["local-detect"]

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
print_stdout = "deny"
print_stderr = "deny"
dbg_macro = "deny"
todo = "deny"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

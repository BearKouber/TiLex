# 独立 package，不是主程序的第二个 bin。
#
# 拆出来的原因：主 package 有 tauri-build 的 build.rs，它会校验 tauri.conf.json
# 里 externalBin 指的文件存在 —— 而这个 exe 正是那个文件，编它之前文件还没有，
# 鸡生蛋。放这儿就完全不碰 tauri。顺带：零依赖，编译一秒钟的事。
#
# 走 workspace 共享 src-tauri/target，产物仍然是 target/release/tilex-ocr.exe，
# ocr.rs 的 sidecar() 查找路径不用改。
[package]
name = "tilex-ocr"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"

[dependencies]
